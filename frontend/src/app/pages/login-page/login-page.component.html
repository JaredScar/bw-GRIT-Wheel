<div class="page login-page">
  <div class="page-header">
    <h1>Sign in to GRIT Award</h1>
    <p>Use your &#64;bitwarden.com Google account to continue.</p>
  </div>

  <div class="card login-card">
    @if (errorMessage()) {
      <div class="banner banner-error">{{ errorMessage() }}</div>
    }

    <button
      class="btn btn-google"
      type="button"
      [disabled]="redirecting()"
      (click)="signInWithGoogle()"
    >
      <svg class="btn-google__icon" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.94v2.33A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.94a9 9 0 0 0 0 8.1l3.03-2.33Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.95l3.03 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
      </svg>
      {{ redirecting() ? 'Redirecting to Google...' : 'Continue with Google' }}
    </button>

    <p class="login-hint">
      Only &#64;bitwarden.com accounts can sign in. If you pick a personal Google account,
      we'll send you back here.
    </p>
  </div>
</div>
